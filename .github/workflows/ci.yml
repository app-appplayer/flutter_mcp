name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.5"

jobs:
  # Pure Dart layer — runs on every host. Catches Dart-side regressions
  # cheaply before paying for native build matrix below.
  analyze-and-test:
    name: analyze + dart tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib
      - run: flutter test

  # Linux desktop — verifies linux/flutter_mcp_plugin.cc compiles + links.
  build-linux:
    name: build linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            libnotify-dev liblzma-dev clang cmake pkg-config \
            libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - working-directory: example
        run: |
          flutter pub get
          flutter build linux --debug

  # Windows desktop — verifies windows/flutter_mcp_plugin.cpp compiles.
  build-windows:
    name: build windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # cache: false — the post-run cache save fails on the
          # generated native build artifacts even though `flutter build
          # windows` itself succeeds. Disabling avoids a spurious red.
          cache: false
      - run: flutter config --enable-windows-desktop
      - working-directory: example
        run: |
          flutter pub get
          flutter build windows --debug

  # macOS desktop integration tests — exercises macos/Classes/* against a
  # real Cocoa app. Tray, NSStatusItem, Keychain, UNUserNotificationCenter.
  test-macos:
    name: macos integration tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - working-directory: example
        run: |
          flutter pub get
          flutter test integration_test/macos_native_test.dart -d macos
          flutter test integration_test/macos_full_test.dart -d macos

  # iOS Simulator integration tests — exercises ios/Classes/* via Xcode
  # build to a booted iPhone simulator.
  #
  # `continue-on-error: true` because the CI macOS runner consistently
  # hangs the iOS Simulator's setUpAll for >12 min on a cold boot, even
  # though the same suite passes in ~5 s on a warm local simulator (15/15
  # tests). Treating it as soft-fail until we can pinpoint the runner-
  # specific delay; local pre-publish verification is the gate.
  test-ios:
    name: ios integration tests
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: list iOS simulators
        run: xcrun simctl list devices available | grep iPhone | head -5
      - name: boot iPhone 15 Pro
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
                runtimes=sorted([k for k in d if 'iOS' in k], reverse=True); \
                print(next(dev['udid'] for r in runtimes \
                  for dev in d[r] if 'iPhone' in dev['name']))")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - working-directory: example
        run: |
          flutter pub get
          flutter test integration_test/ios_native_test.dart -d "$UDID" --timeout 30x

  # Android Emulator integration tests — exercises
  # android/src/main/kotlin/.../FlutterMcpPlugin.kt via reactivecircus
  # action which provides KVM-accelerated emulator on ubuntu-latest.
  test-android:
    name: android integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", \
            OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-32
      - name: create AVD + run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ./example
          script: |
            flutter pub get
            flutter test --no-pub integration_test/android_native_test.dart -d emulator-5554
            flutter test --no-pub integration_test/android_full_test.dart -d emulator-5554

  # Pub publish dry-run — catches manifest issues before tagging release.
  pub-dry-run:
    name: pub publish --dry-run
    runs-on: ubuntu-latest
    # test-ios is omitted from needs while the runner-specific
    # simulator hang is being investigated; iOS is gated by local
    # verification before each release tag.
    needs:
      [analyze-and-test, build-linux, build-windows, test-macos, test-android]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --dry-run
